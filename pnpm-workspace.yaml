packages:
  - "packages/*"
  - "plugin-examples"

# Dependency pins. These lived under a top-level `overrides` key in
# package.json, which is npm-only syntax -- pnpm never read them, so every pin
# below was silently inert (the lockfile resolved lightningcss 1.31/1.32 while
# this file claimed 1.30.1). pnpm >=11 reads settings from THIS file, not from
# the "pnpm" field in package.json, which it now ignores outright.
overrides:
  "@codemirror/language": "6.12.4"
  "@codemirror/view": "6.43.6"
  lightningcss: "1.30.1"
  react: "19.1.0"
  react-dom: "19.1.0"
  react-native-reanimated: "4.3.1"
  react-native-worklets: "0.8.3"

allowBuilds:
  dtrace-provider: true
  electron: true
  electron-winstaller: true
  esbuild: true
  lefthook: true
  node-pty: true
  sharp: true
  unrs-resolver: true
  workerd: true
