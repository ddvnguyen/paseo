packages:
  - "packages/*"
  - "plugin-examples"

# Dependency pins. These lived under a top-level `overrides` key in
# package.json, which is npm-only syntax -- pnpm never read them, so every pin
# below was silently inert (the lockfile resolved lightningcss 1.31/1.32 while
# this file claimed 1.30.1). pnpm >=11 reads settings from THIS file, not from
# the "pnpm" field in package.json, which it now ignores outright.
overrides:
  "@codemirror/language": "6.12.4"
  "@codemirror/view": "6.43.6"
  lightningcss: "1.30.1"
  react: "19.1.0"
  react-dom: "19.1.0"
  react-native-reanimated: "4.3.1"
  react-native-worklets: "0.8.3"

# Workspace linking. These were `link-workspace-packages` and
# `prefer-workspace-packages` in .npmrc, where pnpm 11 does not read them:
# `pnpm config get link-workspace-packages` returned undefined with the .npmrc
# present. Left there, `pnpm install --frozen-lockfile` failed against
# @getpaseo/expo-two-way-audio because workspace deps were resolved from the
# registry instead of linked to the local package. They have to be here for a
# plain frozen-lockfile install to work with no extra flags.
linkWorkspacePackages: true
preferWorkspacePackages: true

allowBuilds:
  dtrace-provider: true
  electron: true
  electron-winstaller: true
  esbuild: true
  lefthook: true
  # Newly transitive through msgpackr@2.1.0 after the merge. pnpm 11 writes a
  # literal `set this to true or false` placeholder for an unlisted build
  # script, which is not a boolean, and the install then aborts with
  # ERR_PNPM_IGNORED_BUILDS. Approved: it installs prebuilt per-platform
  # binaries (@msgpackr-extract/msgpackr-extract-<platform>), so its script is
  # a prebuild selection, not a source compile.
  msgpackr-extract: true
  node-pty: true
  sharp: true
  unrs-resolver: true
  workerd: true
