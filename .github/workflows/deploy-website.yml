name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - "CHANGELOG.md"
      - "public-docs/**"
      - "packages/website/**"
      - "packages/protocol/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "patches/**"
      - ".github/workflows/deploy-website.yml"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name != 'release' || (!github.event.release.prerelease && !github.event.release.draft) }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # packages/protocol exports only ./dist/*, so the website typecheck below
      # cannot resolve @getpaseo/protocol until protocol is built. pnpm does not
      # build it on install either: protocol has no prepare/prepublishOnly.
      - name: Build protocol
        run: npm run build:protocol

      - name: Typecheck
        run: npm run typecheck --workspace=@getpaseo/website

      - name: Deploy to Cloudflare Workers
        run: npm run deploy --workspace=@getpaseo/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
