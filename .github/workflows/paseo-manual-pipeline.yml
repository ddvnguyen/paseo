name: Paseo Manual Pipeline

# Fully manual pipeline — NO automatic triggers (push/PR/schedule/tag).
# Trigger from GitHub Actions UI or: gh workflow run paseo-manual-pipeline.yml
#
# Five independently-selectable stages. Tick any combination; stages 2-5
# wait for stage 1 when both selected in the same run, but can also run
# standalone against a past SHA when stage 1 is NOT selected.

on:
  workflow_dispatch:
    inputs:
      # ── Stage 1: Build ────────────────────────────────────────────────
      run_build_hydra:
        description: "Stage 1 — Build paseo hydra"
        required: false
        type: boolean
        default: false
      hydra_branch:
        description: "Branch to build (default: repo default)"
        required: false
        type: string
        default: ""

      # ── Stage 2: Android ──────────────────────────────────────────────
      run_build_android:
        description: "Stage 2 — Build Android APK"
        required: false
        type: boolean
        default: false
      android_build_ref:
        description: "Git SHA to build (empty = use this run's fresh build from Stage 1)"
        required: false
        type: string
        default: ""
      android_variant:
        description: "Android variant: production (sh.paseo.hub) or upstream (sh.paseo)"
        required: false
        type: choice
        default: production
        options:
          - production
          - upstream

      # ── Stage 3: Deploy web UI ────────────────────────────────────────
      run_deploy_web:
        description: "Stage 3 — Deploy paseo web app (Caddy :6969)"
        required: false
        type: boolean
        default: false
      web_build_ref:
        description: "Git SHA to deploy (empty = use this run's fresh build from Stage 1)"
        required: false
        type: string
        default: ""

      # ── Stage 4: Deploy TEST daemon ───────────────────────────────────
      run_deploy_test:
        description: "Stage 4 — Deploy paseo TEST daemon (:6868)"
        required: false
        type: boolean
        default: false
      test_build_ref:
        description: "Git SHA to deploy (empty = use this run's fresh build from Stage 1)"
        required: false
        type: string
        default: ""

      # ── Stage 5: Deploy PROD daemon ───────────────────────────────────
      run_deploy_prod:
        description: "Stage 5 — Deploy paseo PROD daemon (:6767) ⚠️ drops active agents"
        required: false
        type: boolean
        default: false
      prod_build_ref:
        description: "Git SHA to deploy (empty = use this run's fresh build from Stage 1)"
        required: false
        type: string
        default: ""

      # ── Stage 6: Deploy BETA daemon ───────────────────────────────────
      run_deploy_beta:
        description: "Stage 6 — Deploy paseo BETA daemon (:6768)"
        required: false
        type: boolean
        default: false
      beta_build_ref:
        description: "Git SHA to deploy (empty = use this run's fresh build from Stage 1)"
        required: false
        type: string
        default: ""

      # ── Stage 7: Deploy freebuff-acp adapter ──────────────────────────
      run_deploy_freebuff:
        description: "Stage 7 — Deploy freebuff-acp adapter (no daemon restart; new agents pick it up)"
        required: false
        type: boolean
        default: false
      freebuff_target:
        description: "Stage 7 — Which daemon home receives the adapter"
        required: false
        type: choice
        default: test
        options:
          - test
          - prod
          - both
      freebuff_ref:
        description: "Stage 7 — Git SHA of packages/freebuff-acp + plugins/freebuff to deploy"
        required: false
        type: string
        default: ""

# ── Serialize the shared deploy lanes (D3) ──────────────────────────────────
# TEST :6868 and BETA :6768 are single shared lanes: one live home, one systemd
# unit, one port each. Two dispatches racing them interleave their deploys and
# can leave a lane serving one run's bytes under another run's green check, so
# runs must take turns.
#
# `cancel-in-progress: false` is the whole point — a deploy already mid-restart
# is never interrupted, and the next dispatch waits its turn rather than racing.
#
# Scope note: this is workflow-level and the group is a static string, so it
# serializes *every* dispatch of this workflow — the web-only, Android-only and
# PROD stages queue behind each other too. Nothing about which stages a run
# selects changes; they only wait longer. PROD still only ever runs when an
# operator ticks it (D5).
concurrency:
  # Must be unique across the repo's workflows, or a same-named group in another
  # workflow would cancel these runs (and vice versa). Verified: no other
  # workflow in this repo uses this group.
  group: paseo-deploy-lanes
  cancel-in-progress: false
  # Known semantic: `queue` defaults to `single`, so at most ONE run may sit
  # pending in this group. A third dispatch arriving while a second is pending
  # CANCELS the pending second and takes its place; the running first is
  # untouched. `queue: max` (up to 100 pending) would remove that drop, but
  # widening it is the owner's call, not a silent change in a deploy-affecting
  # PR — left as a known semantic, documented on the PR.

permissions:
  contents: write

env:
  BUILDS_ROOT: /home/ddv/paseo/builds
  GRADLE_USER_HOME: /home/ddv/.gradle
  WEB_UI_DEPLOY: /home/ddv/paseo/app/web-ui
  TEST_HOME: /home/ddv/paseo/TEST
  PROD_HOME: /home/ddv/paseo/PROD
  BETA_HOME: /home/ddv/paseo/BETA

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Preflight — guard an empty or under-specified dispatch
  # ═══════════════════════════════════════════════════════════════════════
  # A dispatch with nothing ticked completes *green* having done nothing: every
  # job is skipped, and a run where all jobs skip is not a failure (D4). The
  # same silence hides a deploy stage ticked without Stage 1 and without its
  # *_build_ref (D1) — the failure only surfaces as that stage's own error.
  preflight:
    # Leaf job by design: `preflight` appears in NO `needs` list and no job
    # depends on it. Wiring it into a needs list would force an edit of that
    # job's if-chain — build-android's is a hand-rolled per-job result check
    # (needs.deploy-web.result == 'success' || ... == 'skipped') that a new
    # edge would silently change the meaning of. The guard works because a
    # failing job turns the run red, not because it gates a stage.
    if: |
      !inputs.run_build_hydra &&
      !inputs.run_build_android &&
      !inputs.run_deploy_web &&
      !inputs.run_deploy_test &&
      !inputs.run_deploy_prod &&
      !inputs.run_deploy_beta &&
      !inputs.run_deploy_freebuff
    runs-on: [self-hosted, paseo-host]
    steps:
      - name: Require at least one stage
        run: |
          echo "::error::No stage selected — this dispatch would finish green having done nothing. Tick at least one of: Stage 1 Build hydra, Stage 2 Android, Stage 3 Web, Stage 4 TEST, Stage 5 PROD, Stage 6 BETA, Stage 7 freebuff-acp. A deploy stage ticked without Stage 1 also needs its own *_build_ref."
          exit 1
  # ═══════════════════════════════════════════════════════════════════════
  # Stage 1 — Build paseo hydra
  # ═══════════════════════════════════════════════════════════════════════
  build-hydra:
    if: ${{ inputs.run_build_hydra }}
    runs-on: [self-hosted, paseo-host]
    outputs:
      sha: ${{ steps.sha.outputs.full }}
    steps:
      - name: Resolve branch and SHA
        id: resolve
        run: |
          set -euo pipefail
          BRANCH="${{ inputs.hydra_branch }}"
          if [ -z "$BRANCH" ]; then
            BRANCH="${{ github.event.repository.default_branch }}"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.branch }}
          fetch-depth: 0

      - name: Record resolved SHA
        id: sha
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          FULL_SHA="$(git rev-parse HEAD)"
          echo "short=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "full=$FULL_SHA" >> "$GITHUB_OUTPUT"
          echo "## Build hydra — branch \`${{ steps.resolve.outputs.branch }}\` → SHA $SHORT_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Stamp hydra version
        run: node scripts/sync-workspace-versions.mjs

      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server stack
        run: |
          npm run build:highlight
          npm run build:relay
          npm run build:protocol
          npm run build:client
          npm run build:plugin
          npm run build --workspace=@getpaseo/server
          npm run build --workspace=@getpaseo/cli

      - name: Build web UI (standalone)
        run: node scripts/build-web-ui.mjs

      - name: Persist dist artifact (pnpm-built, dist-only, 1 inode)
        run: |
          set -euo pipefail
          ARTIFACTS_DIR="${{ env.BUILDS_ROOT }}/artifacts"
          HYDRA_BUILDS_DIR="${{ env.BUILDS_ROOT }}/hydra"
          mkdir -p "$ARTIFACTS_DIR" "$HYDRA_BUILDS_DIR"
          # Prune old artifacts keep 5 (each 50M, 1 inode) + prune old exploded hydra keep 1 for fast android on same runner
          ls -1t "$ARTIFACTS_DIR"/*.tar.zst 2>/dev/null | tail -n +6 | xargs -r rm -f || true
          ls -1dt "$HYDRA_BUILDS_DIR"/*/ 2>/dev/null | tail -n +2 | xargs -r rm -rf || true
          # Build a source+dist staging dir for tar (no node_modules, 1 inode as tar.zst).
          # mktemp honors TMPDIR — the runner default /tmp is a RAM-backed tmpfs
          # shared with build memory; stage under the workspace disk instead.
          DEST_TMP=$(mktemp -d -p "${{ github.workspace }}/..")
          mkdir -p "$DEST_TMP"
          rsync -a --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.dev' \
            --exclude 'packages/app/android' \
            --exclude '.pnpm-store' \
            ./ "$DEST_TMP/"
          # Completeness stamp, written into the staging dir so it lands in BOTH the tar
          # artifact below and the exploded copy further down. Every downstream `locate`
          # step now refuses a build dir that lacks this file, or whose contents are not
          # the SHA it asked for: dir + root package.json only proves an extract started,
          # not that it ran to completion (D2b).
          printf '%s\n' "${{ steps.sha.outputs.full }}" > "$DEST_TMP/.paseo-build-complete"
          # Write the artifact to a .tmp sidecar and rename it on success, so an interrupted
          # run (OOM kill, runner loss, SIGKILL) can never leave a truncated file occupying
          # the canonical name that a later stage would happily extract.
          tar -I 'zstd -1 -T0' -cf "$ARTIFACTS_DIR/${{ steps.sha.outputs.full }}.tar.zst.tmp" -C "$DEST_TMP" .
          mv -f "$ARTIFACTS_DIR/${{ steps.sha.outputs.full }}.tar.zst.tmp" "$ARTIFACTS_DIR/${{ steps.sha.outputs.full }}.tar.zst"
          rm -rf "$DEST_TMP"
          ls -lh "$ARTIFACTS_DIR/${{ steps.sha.outputs.full }}.tar.zst"
          du -sh "$ARTIFACTS_DIR/${{ steps.sha.outputs.full }}.tar.zst"
          echo "artifact=$ARTIFACTS_DIR/${{ steps.sha.outputs.full }}.tar.zst" >> "$GITHUB_OUTPUT"
          # Keep an exploded dist-only copy for immediate downstream jobs on same runner (fast path, no tar extract)
          DEST="$HYDRA_BUILDS_DIR/${{ steps.sha.outputs.full }}"
          rm -rf "$DEST" && mkdir -p "$DEST"
          tar -xf "$ARTIFACTS_DIR/${{ steps.sha.outputs.full }}.tar.zst" -C "$DEST"
          git -C "$DEST" init -q || true
          echo "Build persisted dist-only to $DEST + $ARTIFACTS_DIR/${{ steps.sha.outputs.full }}.tar.zst (1 inode)"
          du -sh "$DEST" "$ARTIFACTS_DIR/${{ steps.sha.outputs.full }}.tar.zst"

  # ═══════════════════════════════════════════════════════════════════════
  # Stage 2 — Android APK
  # ═══════════════════════════════════════════════════════════════════════
  build-android:
    # Lowest priority: waits for deploy-web/deploy-test/deploy-prod to finish
    # (or be skipped) before starting, so the fast deploy stages aren't stuck
    # queueing behind Android's long Gradle build on the shared runner pool.
    if: |
      always() &&
      inputs.run_build_android &&
      (needs.build-hydra.result == 'success' || needs.build-hydra.result == 'skipped') &&
      (needs.deploy-web.result == 'success' || needs.deploy-web.result == 'skipped') &&
      (needs.deploy-test.result == 'success' || needs.deploy-test.result == 'skipped') &&
      (needs.deploy-prod.result == 'success' || needs.deploy-prod.result == 'skipped')
    needs: [build-hydra, deploy-web, deploy-test, deploy-prod]
    runs-on: [self-hosted, paseo-host]
    steps:
      - name: Resolve build ref
        id: ref
        # Inputs go through env, never interpolated into the script: a
        # crafted value must not be able to run shell on the self-hosted
        # runner, and REF becomes a path under $BUILDS_ROOT (review #53.4).
        env:
          INPUT_REF: ${{ inputs.android_build_ref }}
        run: |
          set -euo pipefail
          # Same-run hydra output wins: an explicit *_build_ref may be a
          # 7-char short SHA while Hydra persists under the full 40-char
          # SHA (e.g. 8ee0e1e38 vs 8ee0e1e38fde12...). Prefer the fresh
          # output when Stage 1 succeeded in this run.
          REF=""
          STAGE1_SHA=""
          if [ "${{ needs.build-hydra.result }}" = "success" ]; then
            STAGE1_SHA="${{ needs.build-hydra.outputs.sha }}"
            REF="$STAGE1_SHA"
          fi
          # (INPUT_REF arrives via this step's env:, never interpolated into the script.)
          # Disagreement is a hard error, not a silent precedence win (D2a/D2e) — but
          # prefix-tolerant on purpose: the 7-char vs 40-char case documented above is
          # the *same* build, so a bare != would reject a supported input. Only refs
          # where neither string is a prefix of the other are a real disagreement.
          if [ -n "$STAGE1_SHA" ] && [ -n "$INPUT_REF" ]; then
            SAME_REF=0
            case "$STAGE1_SHA" in "$INPUT_REF"*) SAME_REF=1 ;; esac
            case "$INPUT_REF" in "$STAGE1_SHA"*) SAME_REF=1 ;; esac
            if [ "$SAME_REF" -ne 1 ]; then
              echo "::error::both Stage 1 ($STAGE1_SHA) and android_build_ref ($INPUT_REF) set and they disagree — select one, or make them the same SHA"
              exit 1
            fi
          fi
          if [ -z "$REF" ]; then
            REF="$INPUT_REF"
          fi
          if [ -z "$REF" ]; then
            echo "::error::android_build_ref is required — Stage 1 not selected or failed"
            exit 1
          fi
          # The resolved REF is the strongest single check available: it is exactly
          # what the locate step turns into a path and rm -rf's. Stage 1's output is
          # a `git rev-parse` result, so only a supplied ref can fail this.
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{7,40}$'; then
            echo "::error::android_build_ref must be a hex commit SHA (7-40 chars)"
            exit 1
          fi
          echo "sha=$REF" >> "$GITHUB_OUTPUT"

      - name: Locate persisted build (dist-only artifact + pnpm)
        id: locate
        run: |
          set -euo pipefail
          BUILD_DIR="${{ env.BUILDS_ROOT }}/hydra/${{ steps.ref.outputs.sha }}"
          ARTIFACT="${{ env.BUILDS_ROOT }}/artifacts/${{ steps.ref.outputs.sha }}.tar.zst"
          STAMP="$BUILD_DIR/.paseo-build-complete"
          if [ -d "$BUILD_DIR" ] && [ -f "$BUILD_DIR/package.json" ] && [ -f "$STAMP" ] && [ "$(cat "$STAMP")" = "${{ steps.ref.outputs.sha }}" ]; then
            echo "dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"
          elif [ -f "$ARTIFACT" ]; then
            # Never overlay a stale dir: an extract that merges into leftovers
            # from an older run passes every check below while still serving
            # mixed-version bytes.
            rm -rf "$BUILD_DIR"
            mkdir -p "$BUILD_DIR"
            tar -I zstd -xf "$ARTIFACT" -C "$BUILD_DIR"
            git -C "$BUILD_DIR" init -q || true
            if [ ! -f "$STAMP" ] || [ "$(cat "$STAMP")" != "${{ steps.ref.outputs.sha }}" ]; then
              echo "::error::Artifact $ARTIFACT did not yield a .paseo-build-complete stamp for ${{ steps.ref.outputs.sha }} — treating it as incomplete; re-run Stage 1 to rebuild"
              exit 1
            fi
            echo "dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"
            echo "Extracted artifact $ARTIFACT to $BUILD_DIR"
          else
            echo "::error::No persisted build found at $BUILD_DIR nor $ARTIFACT (or it has no .paseo-build-complete stamp for ${{ steps.ref.outputs.sha }}) — run Stage 1 first"
            exit 1
          fi
          echo "## Android build — SHA ${{ steps.ref.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Action defaults request the long-removed `tools` package and fail
          # the step. The runner cache already holds platform-tools,
          # platforms, and build-tools; just accept licenses.
          packages: platform-tools

      - name: Install JS dependencies (pnpm, for expo/metro)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: pnpm install --frozen-lockfile

      - name: Stamp version and resolve metadata
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          node scripts/sync-workspace-versions.mjs
          FULL_SHA="${{ steps.ref.outputs.sha }}"
          SHORT_SHA="${FULL_SHA:0:7}"
          APP_VERSION="$(node -p "require('./packages/app/package.json').version")"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
        id: meta

      # client/highlight/plugin dist/ are already built and persisted by
      # Stage 1 (build-hydra) — no need to rebuild them here.

      - name: Stage google-services.json for variant (repo secret)
        working-directory: ${{ steps.locate.outputs.dir }}/packages/app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_UPSTREAM_JSON: ${{ secrets.GOOGLE_SERVICES_UPSTREAM_JSON }}
        run: |
          set -euo pipefail
          mkdir -p .secrets
          if [ "${{ inputs.android_variant }}" = "upstream" ]; then
            if [ -z "${GOOGLE_SERVICES_UPSTREAM_JSON:-}" ]; then
              echo "::warning::GOOGLE_SERVICES_UPSTREAM_JSON secret empty — build continues without FCM config"
            else
              printf '%s' "$GOOGLE_SERVICES_UPSTREAM_JSON" > .secrets/google-services.upstream.json
              echo "Staged upstream google-services.json"
            fi
          else
            if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
              echo "::warning::GOOGLE_SERVICES_JSON secret empty — build continues without FCM config"
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" > .secrets/google-services.prod.json
              echo "Staged production google-services.json"
            fi
          fi
      - name: Expo prebuild (APP_VARIANT from android_variant input)
        working-directory: ${{ steps.locate.outputs.dir }}/packages/app
        run: |
          if [ "${{ inputs.android_variant }}" = "upstream" ]; then VARIANT=upstream; else VARIANT=production; fi
          echo "Building variant: $VARIANT"
          npx cross-env APP_VARIANT=$VARIANT expo prebuild \
            --platform android --clean --non-interactive

      - name: Clean corrupted gradle cache (journal-1)
        run: |
          rm -rf "${{ env.GRADLE_USER_HOME }}/caches/journal-1/file-access.bin" 2>/dev/null || true
          rm -rf "${{ env.GRADLE_USER_HOME }}/caches/journal-1/file-access.bin.lock" 2>/dev/null || true
          rm -rf "${{ env.GRADLE_USER_HOME }}/caches/journal-1/journal-1.lock" 2>/dev/null || true
          rm -rf "${{ env.GRADLE_USER_HOME }}/caches/8.14.3/fileHashes/fileHashes.lock" 2>/dev/null || true
          rm -rf "${{ env.GRADLE_USER_HOME }}/caches/8.14.3/fileHashes/fileHashes.bin.lock" 2>/dev/null || true
          pkill -9 -f GradleDaemon 2>/dev/null || true

      - name: Gradle assembleRelease
        working-directory: ${{ steps.locate.outputs.dir }}/packages/app/android
        run: |
          export GRADLE_USER_HOME="${{ env.GRADLE_USER_HOME }}"
          # hermesc (JS→bytecode, 5925 modules) OOM-killed twice under -Xmx4g
          # (EAS exit 137 + local 0-byte .hbc stall). Box has 123G RAM / 31G
          # free — give the build JVM headroom. oomd risk accepted: the old
          # 8-worker kill was worker-count, not heap (now capped at 2).
          export GRADLE_OPTS="-Xmx8g -XX:MaxMetaspaceSize=1g"
          # JAVA_HOME/ANDROID_HOME are set by setup-java/setup-android actions
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version
          if [ -z "$ANDROID_HOME" ] && [ -n "$ANDROID_SDK_ROOT" ]; then
            export ANDROID_HOME="$ANDROID_SDK_ROOT"
          fi
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          # kotlin.compiler.execution.strategy=in-process: the Kotlin daemon
          # (2.6G) + Gradle worker API (2.7G) otherwise eat the runner cgroup
          # budget alongside hermesc (16G+), re-throttling the build.
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            --max-workers=2 \
            -Dkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.workers.max=2 \
            -x lint -x lintVitalAnalyzeRelease -x lintVitalRelease \
            -x generateReleaseLintModel -x generateReleaseLintVitalModel \
            --no-daemon

      - name: Copy APK to builds
        run: |
          set -euo pipefail
          if [ "${{ inputs.android_variant }}" = "upstream" ]; then SUFFIX="-upstream"; else SUFFIX=""; fi
          APK_SRC="${{ steps.locate.outputs.dir }}/packages/app/android/app/build/outputs/apk/release/app-release.apk"
          APK_DEST="${{ env.BUILDS_ROOT }}/android/${{ steps.ref.outputs.sha }}$SUFFIX.apk"
          mkdir -p "${{ env.BUILDS_ROOT }}/android"
          cp "$APK_SRC" "$APK_DEST"
          echo "APK persisted to $APK_DEST"
          ls -lh "$APK_DEST"
          echo "apk_dest=$APK_DEST" >> "$GITHUB_OUTPUT"
          echo "## APK artifact: \`$APK_DEST\`" >> "$GITHUB_STEP_SUMMARY"
        id: apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hydra-paseo-${{ steps.ref.outputs.sha }}${{ inputs.android_variant == 'upstream' && '-upstream' || '' }}-android.apk
          path: ${{ steps.apk.outputs.apk_dest }}
          retention-days: 30

      - name: Create tag and GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APP_VER="${{ steps.meta.outputs.app_version }}"
          SHORT_SHA="${{ steps.meta.outputs.short_sha }}"
          # Ensure tag is unique per commit even if APP_VER was short-stamped in persisted dir without git
          if [[ "$APP_VER" == *"$SHORT_SHA"* ]]; then
            TAG="hub-android-${APP_VER}"
          else
            TAG="hub-android-${APP_VER}-${SHORT_SHA}"
          fi
          if [ -z "$APP_VER" ]; then TAG="hub-android-${SHORT_SHA}"; fi
          if [ "${{ inputs.android_variant }}" = "upstream" ]; then TAG="$TAG-upstream"; fi
          APK="${{ steps.apk.outputs.apk_dest }}"
          if [ ! -f "$APK" ]; then
            echo "::error::APK not found at $APK"
            exit 1
          fi
          echo "APK built: $APK (app_version $APP_VER, sha ${{ steps.ref.outputs.sha }})"
          # Release publish runs from your laptop (user PAT), not the runner:
          # the self-hosted runner's GITHUB_TOKEN is denied releases (403
          # Resource not accessible by integration, seen 2026-09-19), so this
          # step only verifies the APK and prints the publish command.
          # Publish: gh release create "$TAG" --repo "${{ github.repository }}" \
          #   --title "Paseo Hub Android $APP_VER" --target "${{ steps.ref.outputs.sha }}" "$APK"
          echo "## 📦 APK ready: \`$APK\` — publish: \`gh release create \"$TAG\" --repo \"${{ github.repository }}\" --target \"${{ steps.ref.outputs.sha }}\" \"$APK\"\`" >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════════════
  # Stage 3 — Deploy web UI
  # ═══════════════════════════════════════════════════════════════════════
  deploy-web:
    if: ${{ always() && inputs.run_deploy_web }}
    needs: [build-hydra]
    runs-on: [self-hosted, paseo-host]
    steps:
      - name: Resolve build ref
        id: ref
        # Inputs go through env, never interpolated into the script: a
        # crafted value must not be able to run shell on the self-hosted
        # runner, and REF becomes a path under $BUILDS_ROOT (review #53.4).
        env:
          INPUT_REF: ${{ inputs.web_build_ref }}
        run: |
          set -euo pipefail
          # Precedence stays input-first (an explicit ref means "deploy exactly this
          # SHA"), but a disagreement with Stage 1 is now a hard error instead of a
          # silent precedence win: Stage 1 built one SHA while the operator named
          # another, and quietly picking one of them is how a green run ships the
          # wrong bytes (D2a/D2e).
          STAGE1_SHA=""
          if [ "${{ needs.build-hydra.result }}" = "success" ]; then
            STAGE1_SHA="${{ needs.build-hydra.outputs.sha }}"
          fi
          # (INPUT_REF arrives via this step's env:, never interpolated into the script.)
          if [ -n "$STAGE1_SHA" ] && [ -n "$INPUT_REF" ] && [ "$INPUT_REF" != "$STAGE1_SHA" ]; then
            echo "::error::both Stage 1 ($STAGE1_SHA) and web_build_ref ($INPUT_REF) set and they disagree — select one, or make them the same SHA"
            exit 1
          fi
          REF="$INPUT_REF"
          if [ -z "$REF" ]; then
            REF="$STAGE1_SHA"
          fi
          if [ -z "$REF" ]; then
            echo "::error::web_build_ref is required — Stage 1 not selected or failed"
            exit 1
          fi
          # The resolved REF is the strongest single check available: it is exactly
          # what the locate step turns into a path and rm -rf's. Stage 1's output is
          # a `git rev-parse` result, so only a supplied ref can fail this.
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{7,40}$'; then
            echo "::error::web_build_ref must be a hex commit SHA (7-40 chars)"
            exit 1
          fi
          echo "sha=$REF" >> "$GITHUB_OUTPUT"

      - name: Locate persisted build (dist-only pnpm artifact)
        id: locate
        run: |
          set -euo pipefail
          BUILD_DIR="${{ env.BUILDS_ROOT }}/hydra/${{ steps.ref.outputs.sha }}"
          ARTIFACT="${{ env.BUILDS_ROOT }}/artifacts/${{ steps.ref.outputs.sha }}.tar.zst"
          STAMP="$BUILD_DIR/.paseo-build-complete"
          if [ -d "$BUILD_DIR" ] && [ -f "$BUILD_DIR/package.json" ] && [ -f "$STAMP" ] && [ "$(cat "$STAMP")" = "${{ steps.ref.outputs.sha }}" ]; then
            echo "dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"
          elif [ -f "$ARTIFACT" ]; then
            # Never overlay a stale dir: an extract that merges into leftovers
            # from an older run passes every check below while still serving
            # mixed-version bytes.
            rm -rf "$BUILD_DIR"
            mkdir -p "$BUILD_DIR"
            tar -I zstd -xf "$ARTIFACT" -C "$BUILD_DIR"
            git -C "$BUILD_DIR" init -q || true
            if [ ! -f "$STAMP" ] || [ "$(cat "$STAMP")" != "${{ steps.ref.outputs.sha }}" ]; then
              echo "::error::Artifact $ARTIFACT did not yield a .paseo-build-complete stamp for ${{ steps.ref.outputs.sha }} — treating it as incomplete; re-run Stage 1 to rebuild"
              exit 1
            fi
            echo "dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"
            echo "Extracted artifact $ARTIFACT"
          else
            echo "::error::No persisted build found at $BUILD_DIR nor $ARTIFACT (or it has no .paseo-build-complete stamp for ${{ steps.ref.outputs.sha }})"
            exit 1
          fi
          echo "## Deploy web UI — SHA ${{ steps.ref.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build web UI from persisted build (pnpm-built dist, no rebuild)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          if [ -d "dist/web-ui" ]; then
            echo "dist/web-ui already built (pnpm build), skipping rebuild"
            ls -lh dist/web-ui | head -5
          else
            echo "dist/web-ui missing, building via pnpm"
            pnpm --filter @getpaseo/app build 2>/dev/null || node scripts/build-web-ui.mjs
          fi

      - name: Deploy to paseo-app
        run: |
          set -euo pipefail
          SRC="${{ steps.locate.outputs.dir }}/dist/web-ui"
          DEST="${{ env.WEB_UI_DEPLOY }}"
          # Same empty-dir hazard as the package dists (review #53.2): an empty
          # dist/web-ui satisfies the build step's [ -d ] test, and rsync --delete
          # would then wipe the live web UI to nothing. Checked here rather than in
          # locate, because the build step above may legitimately create dist/web-ui
          # when it is absent -- so it does not have to exist yet at locate time.
          if [ ! -d "$SRC" ] || [ -z "$(ls -A "$SRC" 2>/dev/null)" ]; then
            echo "::error::$SRC is missing or empty — refusing to rsync --delete over the live web UI at $DEST"
            exit 1
          fi
          mkdir -p "$DEST"
          rsync -a --delete "$SRC/" "$DEST/"
          echo "Deployed web UI to $DEST"
          ls "$DEST" | head -5

      - name: Reload Caddy
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          systemctl --user reload paseo-app.service || \
            systemctl --user restart paseo-app.service
          echo "Caddy reloaded"

  # ═══════════════════════════════════════════════════════════════════════
  # Stage 4 — Deploy TEST daemon
  # ═══════════════════════════════════════════════════════════════════════
  deploy-test:
    if: ${{ always() && inputs.run_deploy_test }}
    needs: [build-hydra]
    runs-on: [self-hosted, paseo-host]
    # The workflow grants only `contents: write`, and specifying any permission
    # sets every unlisted scope to `none` — so the lane-record commit status
    # below needs `statuses: write` named explicitly. Job-level permissions
    # REPLACE the workflow-level set for this job, hence `contents: write` is
    # repeated here so the job keeps what it already had.
    permissions:
      contents: write
      statuses: write
    steps:
      - name: Resolve build ref
        id: ref
        # Inputs go through env, never interpolated into the script: a
        # crafted value must not be able to run shell on the self-hosted
        # runner, and REF becomes a path under $BUILDS_ROOT (review #53.4).
        env:
          INPUT_REF: ${{ inputs.test_build_ref }}
        run: |
          set -euo pipefail
          # Precedence stays input-first (an explicit ref means "deploy exactly this
          # SHA"), but a disagreement with Stage 1 is now a hard error instead of a
          # silent precedence win: Stage 1 built one SHA while the operator named
          # another, and quietly picking one of them is how a green run ships the
          # wrong bytes (D2a/D2e).
