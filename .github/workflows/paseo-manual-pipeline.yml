name: Paseo Manual Pipeline

# Fully manual pipeline — NO automatic triggers (push/PR/schedule/tag).
# Trigger from GitHub Actions UI or: gh workflow run paseo-manual-pipeline.yml
#
# Five independently-selectable stages. Tick any combination; stages 2-5
# wait for stage 1 when both selected in the same run, but can also run
# standalone against a past SHA when stage 1 is NOT selected.

on:
  workflow_dispatch:
    inputs:
      # ── Stage 1: Build ────────────────────────────────────────────────
      run_build_hydra:
        description: "Stage 1 — Build paseo hydra"
        required: false
        type: boolean
        default: false
      hydra_branch:
        description: "Branch to build (default: repo default)"
        required: false
        type: string
        default: ""

      # ── Stage 2: Android ──────────────────────────────────────────────
      run_build_android:
        description: "Stage 2 — Build Android APK"
        required: false
        type: boolean
        default: false
      android_build_ref:
        description: "Git SHA to build (empty = use this run's fresh build from Stage 1)"
        required: false
        type: string
        default: ""

      # ── Stage 3: Deploy web UI ────────────────────────────────────────
      run_deploy_web:
        description: "Stage 3 — Deploy paseo web app (Caddy :6969)"
        required: false
        type: boolean
        default: false
      web_build_ref:
        description: "Git SHA to deploy (empty = use this run's fresh build from Stage 1)"
        required: false
        type: string
        default: ""

      # ── Stage 4: Deploy TEST daemon ───────────────────────────────────
      run_deploy_test:
        description: "Stage 4 — Deploy paseo TEST daemon (:6868)"
        required: false
        type: boolean
        default: false
      test_build_ref:
        description: "Git SHA to deploy (empty = use this run's fresh build from Stage 1)"
        required: false
        type: string
        default: ""

      # ── Stage 5: Deploy PROD daemon ───────────────────────────────────
      run_deploy_prod:
        description: "Stage 5 — Deploy paseo PROD daemon (:6767) ⚠️ drops active agents"
        required: false
        type: boolean
        default: false
      prod_build_ref:
        description: "Git SHA to deploy (empty = use this run's fresh build from Stage 1)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  BUILDS_ROOT: /mnt/WorkDisk/actions-runners/paseo/builds
  JAVA_HOME: /tmp/jdk-17.0.12
  ANDROID_HOME: /tmp/android-sdk
  GRADLE_USER_HOME: /home/ddv/.gradle
  WEB_UI_DEPLOY: /home/ddv/paseo-app/web-ui
  TEST_HOME: /home/ddv/.paseo-test
  PROD_HOME: /home/ddv/paseo-prod-bun

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Stage 1 — Build paseo hydra
  # ═══════════════════════════════════════════════════════════════════════
  build-hydra:
    if: ${{ inputs.run_build_hydra }}
    runs-on: [self-hosted, paseo-host]
    outputs:
      sha: ${{ steps.sha.outputs.full }}
    steps:
      - name: Resolve branch and SHA
        id: resolve
        run: |
          set -euo pipefail
          BRANCH="${{ inputs.hydra_branch }}"
          if [ -z "$BRANCH" ]; then
            BRANCH="${{ github.event.repository.default_branch }}"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.branch }}
          fetch-depth: 0

      - name: Record resolved SHA
        id: sha
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          FULL_SHA="$(git rev-parse HEAD)"
          echo "short=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "full=$FULL_SHA" >> "$GITHUB_OUTPUT"
          echo "## Build hydra — branch \`${{ steps.resolve.outputs.branch }}\` → SHA $SHORT_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Stamp hydra version
        run: node scripts/sync-workspace-versions.mjs

      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server stack
        run: |
          npm run build:highlight
          npm run build:relay
          npm run build:protocol
          npm run build:client
          npm run build:plugin
          npm run build --workspace=@getpaseo/server
          npm run build --workspace=@getpaseo/cli

      - name: Build web UI (standalone)
        run: node scripts/build-web-ui.mjs

      - name: Persist dist artifact (pnpm-built, dist-only, 1 inode)
        run: |
          set -euo pipefail
          ARTIFACTS_DIR="${{ env.BUILDS_ROOT }}/artifacts"
          HYDRA_BUILDS_DIR="${{ env.BUILDS_ROOT }}/hydra"
          mkdir -p "$ARTIFACTS_DIR" "$HYDRA_BUILDS_DIR"
          # Prune old artifacts keep 5 (each 50M, 1 inode) + prune old exploded hydra keep 1 for fast android on same runner
          ls -1t "$ARTIFACTS_DIR"/*.tar.zst 2>/dev/null | tail -n +6 | xargs -r rm -f || true
          ls -1dt "$HYDRA_BUILDS_DIR"/*/ 2>/dev/null | tail -n +2 | xargs -r rm -rf || true
          # Build a source+dist staging dir for tar (no node_modules, 1 inode as tar.zst)
          DEST_TMP=$(mktemp -d)
          mkdir -p "$DEST_TMP"
          rsync -a --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.dev' \
            --exclude 'packages/app/android' \
            --exclude '.pnpm-store' \
            ./ "$DEST_TMP/"
          tar -I 'zstd -1 -T0' -cf "$ARTIFACTS_DIR/${{ steps.sha.outputs.full }}.tar.zst" -C "$DEST_TMP" .
          rm -rf "$DEST_TMP"
          ls -lh "$ARTIFACTS_DIR/${{ steps.sha.outputs.full }}.tar.zst"
          du -sh "$ARTIFACTS_DIR/${{ steps.sha.outputs.full }}.tar.zst"
          echo "artifact=$ARTIFACTS_DIR/${{ steps.sha.outputs.full }}.tar.zst" >> "$GITHUB_OUTPUT"
          # Keep an exploded dist-only copy for immediate downstream jobs on same runner (fast path, no tar extract)
          DEST="$HYDRA_BUILDS_DIR/${{ steps.sha.outputs.full }}"
          rm -rf "$DEST" && mkdir -p "$DEST"
          tar -xf "$ARTIFACTS_DIR/${{ steps.sha.outputs.full }}.tar.zst" -C "$DEST"
          git -C "$DEST" init -q || true
          echo "Build persisted dist-only to $DEST + $ARTIFACTS_DIR/${{ steps.sha.outputs.full }}.tar.zst (1 inode)"
          du -sh "$DEST" "$ARTIFACTS_DIR/${{ steps.sha.outputs.full }}.tar.zst"

  # ═══════════════════════════════════════════════════════════════════════
  # Stage 2 — Android APK
  # ═══════════════════════════════════════════════════════════════════════
  build-android:
    # Lowest priority: waits for deploy-web/deploy-test/deploy-prod to finish
    # (or be skipped) before starting, so the fast deploy stages aren't stuck
    # queueing behind Android's long Gradle build on the shared runner pool.
    if: |
      always() &&
      inputs.run_build_android &&
      (needs.build-hydra.result == 'success' || needs.build-hydra.result == 'skipped') &&
      (needs.deploy-web.result == 'success' || needs.deploy-web.result == 'skipped') &&
      (needs.deploy-test.result == 'success' || needs.deploy-test.result == 'skipped') &&
      (needs.deploy-prod.result == 'success' || needs.deploy-prod.result == 'skipped')
    needs: [build-hydra, deploy-web, deploy-test, deploy-prod]
    runs-on: [self-hosted, paseo-host]
    steps:
      - name: Resolve build ref
        id: ref
        run: |
          set -euo pipefail
          REF="${{ inputs.android_build_ref }}"
          if [ -z "$REF" ] && [ "${{ needs.build-hydra.result }}" = "success" ]; then
            REF="${{ needs.build-hydra.outputs.sha }}"
          fi
          if [ -z "$REF" ]; then
            echo "::error::android_build_ref is required when Stage 1 is not selected"
            exit 1
          fi
          echo "sha=$REF" >> "$GITHUB_OUTPUT"

      - name: Locate persisted build (dist-only artifact + pnpm)
        id: locate
        run: |
          set -euo pipefail
          BUILD_DIR="${{ env.BUILDS_ROOT }}/hydra/${{ steps.ref.outputs.sha }}"
          ARTIFACT="${{ env.BUILDS_ROOT }}/artifacts/${{ steps.ref.outputs.sha }}.tar.zst"
          if [ -d "$BUILD_DIR" ] && [ -f "$BUILD_DIR/package.json" ]; then
            echo "dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"
          elif [ -f "$ARTIFACT" ]; then
            mkdir -p "$BUILD_DIR"
            tar -I zstd -xf "$ARTIFACT" -C "$BUILD_DIR"
            git -C "$BUILD_DIR" init -q || true
            echo "dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"
            echo "Extracted artifact $ARTIFACT to $BUILD_DIR"
          else
            echo "::error::No persisted build found at $BUILD_DIR nor $ARTIFACT — run Stage 1 first"
            exit 1
          fi
          echo "## Android build — SHA ${{ steps.ref.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install JS dependencies (pnpm, for expo/metro)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: pnpm install --frozen-lockfile

      - name: Stamp version and resolve metadata
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          bun scripts/sync-workspace-versions.mjs
          FULL_SHA="${{ steps.ref.outputs.sha }}"
          SHORT_SHA="${FULL_SHA:0:7}"
          APP_VERSION="$(node -p "require('./packages/app/package.json').version")"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
        id: meta

      # client/highlight/plugin dist/ are already built and persisted by
      # Stage 1 (build-hydra) — no need to rebuild them here.

      - name: Expo prebuild (production variant)
        working-directory: ${{ steps.locate.outputs.dir }}/packages/app
        run: |
          npx cross-env APP_VARIANT=production expo prebuild \
            --platform android --clean --non-interactive

      - name: Clean corrupted gradle cache (journal-1)
        run: |
          rm -rf "${{ env.GRADLE_USER_HOME }}/caches/journal-1/file-access.bin" 2>/dev/null || true
          rm -rf "${{ env.GRADLE_USER_HOME }}/caches/journal-1/file-access.bin.lock" 2>/dev/null || true

      - name: Gradle assembleRelease
        working-directory: ${{ steps.locate.outputs.dir }}/packages/app/android
        run: |
          export JAVA_HOME="${{ env.JAVA_HOME }}"
          export ANDROID_HOME="${{ env.ANDROID_HOME }}"
          export GRADLE_USER_HOME="${{ env.GRADLE_USER_HOME }}"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$PATH"
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -x lint -x lintVitalAnalyzeRelease -x lintVitalRelease \
            -x generateReleaseLintModel -x generateReleaseLintVitalModel \
            --no-daemon

      - name: Copy APK to builds
        run: |
          set -euo pipefail
          APK_SRC="${{ steps.locate.outputs.dir }}/packages/app/android/app/build/outputs/apk/release/app-release.apk"
          APK_DEST="${{ env.BUILDS_ROOT }}/android/${{ steps.ref.outputs.sha }}.apk"
          mkdir -p "${{ env.BUILDS_ROOT }}/android"
          cp "$APK_SRC" "$APK_DEST"
          echo "APK persisted to $APK_DEST"
          ls -lh "$APK_DEST"
          echo "## APK artifact: \`$APK_DEST\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hydra-paseo-${{ steps.ref.outputs.sha }}-android.apk
          path: ${{ env.BUILDS_ROOT }}/android/${{ steps.ref.outputs.sha }}.apk
          retention-days: 30

      - name: Create tag and GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APP_VER="${{ steps.meta.outputs.app_version }}"
          SHORT_SHA="${{ steps.meta.outputs.short_sha }}"
          # Ensure tag is unique per commit even if APP_VER was short-stamped in persisted dir without git
          if [[ "$APP_VER" == *"$SHORT_SHA"* ]]; then
            TAG="hub-android-${APP_VER}"
          else
            TAG="hub-android-${APP_VER}-${SHORT_SHA}"
          fi
          if [ -z "$APP_VER" ]; then TAG="hub-android-${SHORT_SHA}"; fi
          echo "Checking for existing release $TAG..."
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping create"
            exit 0
          fi
          APK="${{ env.BUILDS_ROOT }}/android/${{ steps.ref.outputs.sha }}.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::APK not found at $APK"
            exit 1
          fi
          echo "Creating release $TAG for $APK (app_version $APP_VER, sha ${{ steps.ref.outputs.sha }})"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Paseo Hub Android $APP_VER" \
            --notes "Automated Android build for commit ${{ steps.ref.outputs.sha }} (branch \`${{ github.ref_name }}\`). Built via Paseo Manual Pipeline.\n\nAPK: hydra-paseo-${{ steps.ref.outputs.sha }}-android.apk" \
            --target "${{ steps.ref.outputs.sha }}" \
            "$APK"
          echo "Release $TAG created with APK"
          echo "## 📦 Release [$TAG](${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG) created" >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════════════
  # Stage 3 — Deploy web UI
  # ═══════════════════════════════════════════════════════════════════════
  deploy-web:
    if: ${{ inputs.run_deploy_web }}
    needs: [build-hydra]
    runs-on: [self-hosted, paseo-host]
    steps:
      - name: Resolve build ref
        id: ref
        run: |
          set -euo pipefail
          REF="${{ inputs.web_build_ref }}"
          if [ -z "$REF" ] && [ "${{ needs.build-hydra.result }}" = "success" ]; then
            REF="${{ needs.build-hydra.outputs.sha }}"
          fi
          if [ -z "$REF" ]; then
            echo "::error::web_build_ref is required when Stage 1 is not selected"
            exit 1
          fi
          echo "sha=$REF" >> "$GITHUB_OUTPUT"

      - name: Locate persisted build (dist-only pnpm artifact)
        id: locate
        run: |
          set -euo pipefail
          BUILD_DIR="${{ env.BUILDS_ROOT }}/hydra/${{ steps.ref.outputs.sha }}"
          ARTIFACT="${{ env.BUILDS_ROOT }}/artifacts/${{ steps.ref.outputs.sha }}.tar.zst"
          if [ -d "$BUILD_DIR" ] && [ -f "$BUILD_DIR/package.json" ]; then
            echo "dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"
          elif [ -f "$ARTIFACT" ]; then
            mkdir -p "$BUILD_DIR"
            tar -I zstd -xf "$ARTIFACT" -C "$BUILD_DIR"
            git -C "$BUILD_DIR" init -q || true
            echo "dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"
            echo "Extracted artifact $ARTIFACT"
          else
            echo "::error::No persisted build found at $BUILD_DIR nor $ARTIFACT"
            exit 1
          fi
          echo "## Deploy web UI — SHA ${{ steps.ref.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build web UI from persisted build (pnpm-built dist, no rebuild)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          if [ -d "dist/web-ui" ]; then
            echo "dist/web-ui already built (pnpm build), skipping rebuild"
            ls -lh dist/web-ui | head -5
          else
            echo "dist/web-ui missing, building via pnpm"
            pnpm --filter @getpaseo/app build 2>/dev/null || node scripts/build-web-ui.mjs
          fi

      - name: Deploy to paseo-app
        run: |
          set -euo pipefail
          SRC="${{ steps.locate.outputs.dir }}/dist/web-ui"
          DEST="${{ env.WEB_UI_DEPLOY }}"
          mkdir -p "$DEST"
          rsync -a --delete "$SRC/" "$DEST/"
          echo "Deployed web UI to $DEST"
          ls "$DEST" | head -5

      - name: Reload Caddy
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          systemctl --user reload paseo-app.service || \
            systemctl --user restart paseo-app.service
          echo "Caddy reloaded"

  # ═══════════════════════════════════════════════════════════════════════
  # Stage 4 — Deploy TEST daemon
  # ═══════════════════════════════════════════════════════════════════════
  deploy-test:
    if: ${{ inputs.run_deploy_test }}
    needs: [build-hydra]
    runs-on: [self-hosted, paseo-host]
    steps:
      - name: Resolve build ref
        id: ref
        run: |
          set -euo pipefail
          REF="${{ inputs.test_build_ref }}"
          if [ -z "$REF" ] && [ "${{ needs.build-hydra.result }}" = "success" ]; then
            REF="${{ needs.build-hydra.outputs.sha }}"
          fi
          if [ -z "$REF" ]; then
            echo "::error::test_build_ref is required when Stage 1 is not selected"
            exit 1
          fi
          echo "sha=$REF" >> "$GITHUB_OUTPUT"

      - name: Locate persisted build (dist-only pnpm artifact)
        id: locate
        run: |
          set -euo pipefail
          BUILD_DIR="${{ env.BUILDS_ROOT }}/hydra/${{ steps.ref.outputs.sha }}"
          ARTIFACT="${{ env.BUILDS_ROOT }}/artifacts/${{ steps.ref.outputs.sha }}.tar.zst"
          if [ -d "$BUILD_DIR" ] && [ -f "$BUILD_DIR/package.json" ]; then
            echo "dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"
          elif [ -f "$ARTIFACT" ]; then
            mkdir -p "$BUILD_DIR"
            tar -I zstd -xf "$ARTIFACT" -C "$BUILD_DIR"
            git -C "$BUILD_DIR" init -q || true
            echo "dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No persisted build found at $BUILD_DIR nor $ARTIFACT"
            exit 1
          fi
          echo "## Deploy TEST daemon — SHA ${{ steps.ref.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy server to TEST (pnpm prod deploy)
        run: |
          set -euo pipefail
          BUILD_DIR="${{ steps.locate.outputs.dir }}"
          TEST_HOME="${{ env.TEST_HOME }}"
          # Use pnpm to ensure prod node_modules are correctly installed via pnpm store
          # The built dist is already in BUILD_DIR/packages/server/dist, just sync it
          # but also ensure TEST_HOME has correct pnpm prod deps (reusing hydra's pnpm store)
          mkdir -p "$TEST_HOME/node_modules/@getpaseo"
          rsync -a --delete \
            "$BUILD_DIR/packages/server/dist/" \
            "$TEST_HOME/node_modules/@getpaseo/server/dist/"
          cp "$BUILD_DIR/packages/server/package.json" \
            "$TEST_HOME/node_modules/@getpaseo/server/package.json"
          echo "Server deployed to TEST via pnpm-built dist"

      - name: Restart TEST daemon
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          systemctl --user restart paseo-test.service
          echo "TEST daemon restarted"
          sleep 3
          systemctl --user status paseo-test.service --no-pager | head -10

      - name: Verify TEST health
        run: |
          sleep 2
          HEALTH=$(curl -sf http://127.0.0.1:6868/api/health 2>/dev/null || echo '{"status":"error"}')
          echo "TEST health: $HEALTH"

  # ═══════════════════════════════════════════════════════════════════════
  # Stage 5 — Deploy PROD daemon
  # ═══════════════════════════════════════════════════════════════════════
  deploy-prod:
    if: ${{ inputs.run_deploy_prod }}
    needs: [build-hydra]
    runs-on: [self-hosted, paseo-host]
    steps:
      - name: Resolve build ref
        id: ref
        run: |
          set -euo pipefail
          REF="${{ inputs.prod_build_ref }}"
          if [ -z "$REF" ] && [ "${{ needs.build-hydra.result }}" = "success" ]; then
            REF="${{ needs.build-hydra.outputs.sha }}"
          fi
          if [ -z "$REF" ]; then
            echo "::error::prod_build_ref is required when Stage 1 is not selected"
            exit 1
          fi
          echo "sha=$REF" >> "$GITHUB_OUTPUT"

      - name: Locate persisted build (dist-only pnpm artifact)
        id: locate
        run: |
          set -euo pipefail
          BUILD_DIR="${{ env.BUILDS_ROOT }}/hydra/${{ steps.ref.outputs.sha }}"
          ARTIFACT="${{ env.BUILDS_ROOT }}/artifacts/${{ steps.ref.outputs.sha }}.tar.zst"
          if [ -d "$BUILD_DIR" ] && [ -f "$BUILD_DIR/package.json" ]; then
            echo "dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"
          elif [ -f "$ARTIFACT" ]; then
            mkdir -p "$BUILD_DIR"
            tar -I zstd -xf "$ARTIFACT" -C "$BUILD_DIR"
            git -C "$BUILD_DIR" init -q || true
            echo "dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No persisted build found at $BUILD_DIR nor $ARTIFACT"
            exit 1
          fi
          echo "## Deploy PROD daemon — SHA ${{ steps.ref.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy server to PROD (pnpm prod deploy)
        run: |
          set -euo pipefail
          BUILD_DIR="${{ steps.locate.outputs.dir }}"
          PROD_HOME="${{ env.PROD_HOME }}"
          mkdir -p "$PROD_HOME/node_modules/@getpaseo"
          rsync -a --delete \
            "$BUILD_DIR/packages/server/dist/" \
            "$PROD_HOME/node_modules/@getpaseo/server/dist/"
          cp "$BUILD_DIR/packages/server/package.json" \
            "$PROD_HOME/node_modules/@getpaseo/server/package.json"
          echo "Server deployed to PROD via pnpm-built dist"

      - name: Restart PROD daemon
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          systemctl --user restart paseo.service
          echo "PROD daemon restarted"
          sleep 3
          systemctl --user status paseo.service --no-pager | head -10

      - name: Verify PROD health
        run: |
          sleep 2
          HEALTH=$(curl -sf http://127.0.0.1:6767/api/health 2>/dev/null || echo '{"status":"error"}')
          echo "PROD health: $HEALTH"
