      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # No `cache: pnpm` here (D3): the pnpm store lives on ntfs, where the
          # actions/cache tar walk always exits 2, so every run pays a doomed
          # walk for a permanent cache MISS. The store is a persistent shared
          # directory, so the cache buys nothing anyway. build-hydra and
          # build-android already run without it.

      - name: Install PROD runtime deps (pnpm frozen, shared store)
        run: |
          set -euo pipefail
          BUILD_DIR="${{ steps.locate.outputs.dir }}"
          PROD_HOME="${{ env.PROD_HOME }}"
          echo "pnpm store: $(pnpm store path)"
          if [ -f "$PROD_HOME/package.json" ]; then cp "$PROD_HOME/package.json" "$PROD_HOME/package.json.bak"; fi
          cp "$BUILD_DIR/deploy/paseo-prod/package.json" "$PROD_HOME/package.json"
          cp "$BUILD_DIR/deploy/paseo-prod/pnpm-lock.yaml" "$PROD_HOME/pnpm-lock.yaml"
          # --ignore-scripts: see TEST install step — same proven no-scripts runtime state.
          pnpm install --frozen-lockfile --prod --ignore-workspace --ignore-scripts --dir "$PROD_HOME"
          echo "PROD runtime deps installed (frozen lockfile)"

      - name: Deploy server to PROD (pnpm prod deploy)
        run: |
          set -euo pipefail
          BUILD_DIR="${{ steps.locate.outputs.dir }}"
          PROD_HOME="${{ env.PROD_HOME }}"
          mkdir -p "$PROD_HOME/node_modules/@getpaseo"
          # Completeness pre-check: all 7 deployed packages need a
          # package.json AND a dist that exists and is non-empty.
          #
          # * non-empty matters because an empty-but-present dist passes [ -d ], and
          #   rsync --delete would then wipe the live dist to nothing (review #53.2).
          # * package.json matters because the cp below used to be
          #   `2>/dev/null || true`, which failed open (review #53.1).
          #
          # # Cheap re-assert of the completeness pre-check the locate step already ran
          # before any live write. Same predicate as that one, so the two cannot drift.
          INCOMPLETE=""
          for pkg in cli client highlight plugin protocol relay server; do
            PKG_DIST="$BUILD_DIR/packages/$pkg/dist"
            if [ ! -f "$BUILD_DIR/packages/$pkg/package.json" ]; then
              INCOMPLETE="$INCOMPLETE $pkg(no package.json)"
            elif [ ! -d "$PKG_DIST" ] || [ -z "$(ls -A "$PKG_DIST" 2>/dev/null)" ]; then
              INCOMPLETE="$INCOMPLETE $pkg(empty or missing dist)"
            fi
          done
          if [ -n "$INCOMPLETE" ]; then
            echo "::error::Incomplete build at $BUILD_DIR -$INCOMPLETE - refusing to deploy a partial build to PROD (it would leave the previous SHA live under a green run). The live home is left untouched; re-run Stage 1 for this SHA."
            exit 1
          fi
          for pkg in cli client highlight plugin protocol relay server; do
            mkdir -p "$PROD_HOME/node_modules/@getpaseo/$pkg"
            rsync -a --delete "$BUILD_DIR/packages/$pkg/dist/" "$PROD_HOME/node_modules/@getpaseo/$pkg/dist/"
            cp "$BUILD_DIR/packages/$pkg/package.json" "$PROD_HOME/node_modules/@getpaseo/$pkg/package.json"
          done
          echo "Server + protocol/client deps deployed to PROD via pnpm-built dist"

      - name: Put the daemon's bun on PATH for the closure check
        run: |
          set -euo pipefail
          # Mirror of the TEST step above — same host-bun rationale, same
          # GITHUB_PATH mechanism (deploy/systemd/paseo.service runs the daemon
          # with %h/.bun/bin on PATH; an Actions `run:` step does not).
          BUN_BIN="$HOME/.bun/bin"
          if [ ! -x "$BUN_BIN/bun" ]; then
            echo "::error::bun not found at $BUN_BIN/bun — the daemon runtime is missing on this runner"
            exit 1
          fi
          echo "$BUN_BIN" >> "$GITHUB_PATH"
          echo "bun: $BUN_BIN/bun $("$BUN_BIN/bun" --version)"

      - name: Verify runtime dep closure resolves (PROD)
        run: |
          set -euo pipefail
          bun "${{ steps.locate.outputs.dir }}/deploy/verify-closure.bun.mjs" "${{ env.PROD_HOME }}"

      - name: Restart PROD daemon
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          systemctl --user restart paseo.service
          echo "PROD daemon restarted"
          sleep 3
          systemctl --user status paseo.service --no-pager | head -10

      - name: Verify PROD health
        run: |
          sleep 2
          HEALTH=$(curl -sf http://127.0.0.1:6767/api/health 2>/dev/null || echo '{"status":"error"}')
          echo "PROD health: $HEALTH"
          if [ "$HEALTH" = '{"status":"error"}' ]; then echo "::error::PROD health endpoint unreachable after deploy"; exit 1; fi

  # ═══════════════════════════════════════════════════════════════════════
  # Stage 6 — Deploy BETA daemon
  # ═══════════════════════════════════════════════════════════════════════
  # Modelled on deploy-test, with two deliberate differences:
  #  * it waits on deploy-test and requires that TEST passed (see the if below);
  #  * its runtime deps come from deploy/paseo-test/, not a deploy/paseo-beta/.
  #    There is no deploy/paseo-beta/ in this repo, and the test and prod
  #    manifests are the same closure — their package.json files differ only in
  #    `name`/`description` and their pnpm-lock.yaml files are byte-identical —
  #    so reusing the TEST manifest installs the correct dependency set.
  deploy-beta:
    # Owner topology (D-4): build -> TEST -> BETA -> manual PROD.
    #
    # The deploy-test arm below is deliberately two-sided, and `always()` is
    # what makes the second side reachable at all: without it, a *skipped*
    # needs-dependency auto-skips this job, so a beta-only dispatch — the main
    # way anyone will use a BETA stage — could never run.
    #   * deploy-test ticked  -> result is 'success' or 'failure'. This job
    #     waits for it and requires 'success'; a failed TEST blocks BETA.
    #   * deploy-test not ticked -> result is 'skipped'. That is the operator's
    #     explicit choice to deploy BETA on its own (the same class as today's
    #     standalone TEST deploy against a past SHA), so it runs.
    # 'cancelled' satisfies neither arm and blocks, which is the safe default.
    if: |
      always() &&
      inputs.run_deploy_beta &&
      (needs.build-hydra.result == 'success' || needs.build-hydra.result == 'skipped') &&
      (needs.deploy-test.result == 'success' || needs.deploy-test.result == 'skipped')
    needs: [build-hydra, deploy-test]
    runs-on: [self-hosted, paseo-host]
    # Same reason as deploy-test: the workflow-level set is `contents: write`
    # only, and the lane-record commit status below needs `statuses: write`.
    # Job-level permissions replace the workflow-level set for this job, so
    # `contents: write` is repeated to keep what the job already had.
    permissions:
      contents: write
      statuses: write
    steps:
      - name: Resolve build ref
        id: ref
        # Inputs go through env, never interpolated into the script: a crafted
        # value must not be able to run shell on the self-hosted runner, and REF
        # becomes a path under $BUILDS_ROOT (review #53.4).
        env:
          INPUT_REF: ${{ inputs.beta_build_ref }}
        run: |
          set -euo pipefail
          # Precedence stays input-first (an explicit ref means "deploy exactly this
          # SHA"), but a disagreement with Stage 1 is a hard error instead of a
          # silent precedence win: Stage 1 built one SHA while the operator named
          # another, and quietly picking one of them is how a green run ships the
          # wrong bytes (D2a/D2e).
          STAGE1_SHA=""
          if [ "${{ needs.build-hydra.result }}" = "success" ]; then
            STAGE1_SHA="${{ needs.build-hydra.outputs.sha }}"
          fi
          # (INPUT_REF arrives via this step's env:, never interpolated into the script.)
          if [ -n "$STAGE1_SHA" ] && [ -n "$INPUT_REF" ] && [ "$INPUT_REF" != "$STAGE1_SHA" ]; then
            echo "::error::both Stage 1 ($STAGE1_SHA) and beta_build_ref ($INPUT_REF) set and they disagree — select one, or make them the same SHA"
            exit 1
          fi
          REF="$INPUT_REF"
          if [ -z "$REF" ]; then
            REF="$STAGE1_SHA"
          fi
          if [ -z "$REF" ]; then
            echo "::error::beta_build_ref is required — Stage 1 not selected or failed"
            exit 1
          fi
          # The resolved REF is the strongest single check available: it is exactly
          # what the locate step turns into a path and rm -rf's. Stage 1's output is
          # a `git rev-parse` result, so only a supplied ref can fail this.
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{7,40}$'; then
            echo "::error::beta_build_ref must be a hex commit SHA (7-40 chars)"
            exit 1
          fi
          echo "sha=$REF" >> "$GITHUB_OUTPUT"

      - name: Locate persisted build (dist-only pnpm artifact)
        id: locate
        run: |
          set -euo pipefail
          BUILD_DIR="${{ env.BUILDS_ROOT }}/hydra/${{ steps.ref.outputs.sha }}"
          ARTIFACT="${{ env.BUILDS_ROOT }}/artifacts/${{ steps.ref.outputs.sha }}.tar.zst"
          STAMP="$BUILD_DIR/.paseo-build-complete"
          if [ -d "$BUILD_DIR" ] && [ -f "$BUILD_DIR/package.json" ] && [ -f "$STAMP" ] && [ "$(cat "$STAMP")" = "${{ steps.ref.outputs.sha }}" ]; then
            echo "dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"
          elif [ -f "$ARTIFACT" ]; then
            # Never overlay a stale dir: an extract that merges into leftovers
            # from an older run can pass the checks below while still serving
            # mixed-version bytes.
            rm -rf "$BUILD_DIR"
            mkdir -p "$BUILD_DIR"
            tar -I zstd -xf "$ARTIFACT" -C "$BUILD_DIR"
            git -C "$BUILD_DIR" init -q || true
            if [ ! -f "$STAMP" ] || [ "$(cat "$STAMP")" != "${{ steps.ref.outputs.sha }}" ]; then
              echo "::error::Artifact $ARTIFACT did not yield a .paseo-build-complete stamp for ${{ steps.ref.outputs.sha }} — treating it as incomplete; re-run Stage 1 to rebuild"
              exit 1
            fi
            echo "dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No persisted build found at $BUILD_DIR nor $ARTIFACT (or it has no .paseo-build-complete stamp for ${{ steps.ref.outputs.sha }})"
            exit 1
          fi
          # Completeness pre-check: all 7 deployed packages need a
          # package.json AND a dist that exists and is non-empty.
          #
          # * non-empty matters because an empty-but-present dist passes [ -d ], and
          #   rsync --delete would then wipe the live dist to nothing (review #53.2).
          # * package.json matters because the cp below used to be
          #   `2>/dev/null || true`, which failed open (review #53.1).
          #
          # # Placed here, after the build is located but BEFORE the install step writes
          # package.json + pnpm-lock.yaml and runs pnpm install into the live home.
          # Running this in the deploy step instead let a partial build swap the live
          # home's dependency closure on a red run (review #53.3). The invariant this
          # establishes: on a red run, ZERO bytes of the live home are modified.
          INCOMPLETE=""
          for pkg in cli client highlight plugin protocol relay server; do
            PKG_DIST="$BUILD_DIR/packages/$pkg/dist"
            if [ ! -f "$BUILD_DIR/packages/$pkg/package.json" ]; then
              INCOMPLETE="$INCOMPLETE $pkg(no package.json)"
            elif [ ! -d "$PKG_DIST" ] || [ -z "$(ls -A "$PKG_DIST" 2>/dev/null)" ]; then
              INCOMPLETE="$INCOMPLETE $pkg(empty or missing dist)"
            fi
          done
          if [ -n "$INCOMPLETE" ]; then
            echo "::error::Incomplete build at $BUILD_DIR -$INCOMPLETE - refusing to deploy a partial build to BETA_HOME (it would leave the previous SHA live under a green run). The live home is left untouched; re-run Stage 1 for this SHA."
            exit 1
          fi
          echo "## Deploy BETA daemon — SHA ${{ steps.ref.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # No `cache: pnpm` — see the D3 note on the deploy-test stage.

      - name: Install BETA runtime deps (pnpm frozen, shared store)
        run: |
          set -euo pipefail
          BUILD_DIR="${{ steps.locate.outputs.dir }}"
          BETA_HOME="${{ env.BETA_HOME }}"
          echo "pnpm store: $(pnpm store path)"
          # deploy/paseo-test/ is the manifest set BETA reuses — see the job
          # header for why there is no deploy/paseo-beta/.
          cp "$BUILD_DIR/deploy/paseo-test/package.json" "$BETA_HOME/package.json"
          cp "$BUILD_DIR/deploy/paseo-test/pnpm-lock.yaml" "$BETA_HOME/pnpm-lock.yaml"
          # --ignore-scripts: see the TEST install step — same proven no-scripts
          # runtime state.
          pnpm install --frozen-lockfile --prod --ignore-workspace --ignore-scripts --dir "$BETA_HOME"
          echo "BETA runtime deps installed (frozen lockfile)"

      - name: Deploy server to BETA (pnpm prod deploy)
        run: |
          set -euo pipefail
          BUILD_DIR="${{ steps.locate.outputs.dir }}"
          BETA_HOME="${{ env.BETA_HOME }}"
          mkdir -p "$BETA_HOME/node_modules/@getpaseo"
          # Completeness pre-check: all 7 deployed packages need a
          # package.json AND a dist that exists and is non-empty.
          #
          # * non-empty matters because an empty-but-present dist passes [ -d ], and
          #   rsync --delete would then wipe the live dist to nothing (review #53.2).
          # * package.json matters because the cp below used to be
          #   `2>/dev/null || true`, which failed open (review #53.1).
          #
          # # Cheap re-assert of the completeness pre-check the locate step already ran
          # before any live write. Same predicate as that one, so the two cannot drift.
          INCOMPLETE=""
          for pkg in cli client highlight plugin protocol relay server; do
            PKG_DIST="$BUILD_DIR/packages/$pkg/dist"
            if [ ! -f "$BUILD_DIR/packages/$pkg/package.json" ]; then
              INCOMPLETE="$INCOMPLETE $pkg(no package.json)"
            elif [ ! -d "$PKG_DIST" ] || [ -z "$(ls -A "$PKG_DIST" 2>/dev/null)" ]; then
              INCOMPLETE="$INCOMPLETE $pkg(empty or missing dist)"
            fi
          done
          if [ -n "$INCOMPLETE" ]; then
            echo "::error::Incomplete build at $BUILD_DIR -$INCOMPLETE - refusing to deploy a partial build to BETA_HOME (it would leave the previous SHA live under a green run). The live home is left untouched; re-run Stage 1 for this SHA."
            exit 1
          fi
          for pkg in cli client highlight plugin protocol relay server; do
            mkdir -p "$BETA_HOME/node_modules/@getpaseo/$pkg"
            rsync -a --delete "$BUILD_DIR/packages/$pkg/dist/" "$BETA_HOME/node_modules/@getpaseo/$pkg/dist/"
            cp "$BUILD_DIR/packages/$pkg/package.json" "$BETA_HOME/node_modules/@getpaseo/$pkg/package.json"
          done
          echo "Server + protocol/client deps deployed to BETA via pnpm-built dist"

      - name: Put the daemon's bun on PATH for the closure check
        run: |
          set -euo pipefail
          # Mirror of the TEST step — same host-bun rationale, same GITHUB_PATH
          # mechanism (an Actions `run:` step gets no profile, so bun is absent).
          BUN_BIN="$HOME/.bun/bin"
          if [ ! -x "$BUN_BIN/bun" ]; then
            echo "::error::bun not found at $BUN_BIN/bun — the daemon runtime is missing on this runner"
            exit 1
          fi
          echo "$BUN_BIN" >> "$GITHUB_PATH"
          echo "bun: $BUN_BIN/bun $("$BUN_BIN/bun" --version)"

      - name: Verify runtime dep closure resolves (BETA)
        run: |
          set -euo pipefail
          bun "${{ steps.locate.outputs.dir }}/deploy/verify-closure.bun.mjs" "${{ env.BETA_HOME }}"

      - name: Restart BETA daemon
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          systemctl --user restart paseo-beta.service
          echo "BETA daemon restarted"
          sleep 3
          systemctl --user status paseo-beta.service --no-pager | head -10

      - name: Verify BETA health
        run: |
          sleep 2
          HEALTH=$(curl -sf http://127.0.0.1:6768/api/health 2>/dev/null || echo '{"status":"error"}')
          echo "BETA health: $HEALTH"
          if [ "$HEALTH" = '{"status":"error"}' ]; then echo "::error::BETA health endpoint unreachable after deploy"; exit 1; fi

      - name: Assert BETA unit identity
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          # Identity-level guard, deliberately not a sha-level one: the daemon
          # exposes no build SHA on an unauthenticated endpoint (/api/health
          # returns only status+timestamp; /api/status carries a version but is
          # behind bearer auth), so there is nothing to compare the SHA against.
          # What this does catch is the realistic BETA failure — the unit not
          # installed, crashed on boot, or left pointing at another env's
          # PASEO_HOME — which would make :6768 serve TEST's or PROD's bytes.
          ACTIVE=$(systemctl --user is-active paseo-beta.service || true)
          if [ "$ACTIVE" != "active" ]; then
            echo "::error::paseo-beta.service is '$ACTIVE' after restart — BETA did not come up"
            exit 1
          fi
          UNIT_ENV=$(systemctl --user show paseo-beta.service -p Environment --value)
          case "$UNIT_ENV" in
            *"PASEO_HOME=/home/ddv/paseo/BETA"*)
              echo "BETA unit is active and pinned to PASEO_HOME=/home/ddv/paseo/BETA"
              ;;
            *)
              echo "::error::paseo-beta.service is not pinned to PASEO_HOME=/home/ddv/paseo/BETA (Environment: $UNIT_ENV) — refusing to treat :6768 as a healthy BETA"
              exit 1
              ;;
          esac

      # ── Lane record (D3) ────────────────────────────────────────────────
      # Last step, so it runs only after the health gate AND the unit-identity
      # assert passed, and records what :6768 is serving *right now*.
      #
      # Two sinks on purpose, same as deploy-test: the step summary is the
      # human-readable one but it dies with the run, so it cannot answer "which
      # SHA does BETA serve today?" — the pre-merge gate needs that question
      # answered per-SHA and long after the run is gone. A commit status is
      # stored against the SHA and is queryable later, so it is the durable
      # half.
      - name: Record BETA lane served SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job never checks the repo out, so `gh` has no git remote to
          # resolve {owner}/{repo} from and the status path fails to expand
          # ("unable to expand placeholder in path: ... not a git
          # repository"). Name the repo explicitly instead.
          GH_REPO: ${{ github.repository }}
          LANE: BETA
          LANE_CONTEXT: lane-serving/beta
          # The SHA this lane was actually given — deliberately NOT
          # github.sha. A standalone BETA deploy names a past SHA in
          # beta_build_ref, so the run's own SHA is frequently not what :6768
          # is serving; recording that would make the gate lie.
          SERVED_SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -euo pipefail
          SERVED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RUN_URL="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
          # The statuses API takes only the full 40-char SHA. Stage 1 always
          # produces one and reaching this step means a build dir named by this
          # ref already existed, so the short form should be unreachable —
          # but a short ref is a 422 here, so expand it instead of failing.
          FULL_SHA="$SERVED_SHA"
          if ! printf '%s' "$SERVED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            RESOLVED="$(gh api "repos/$GH_REPO/commits/$SERVED_SHA" --jq .sha 2>/dev/null || true)"
            if printf '%s' "$RESOLVED" | grep -Eq '^[0-9a-f]{40}$'; then
              FULL_SHA="$RESOLVED"
            fi
          fi
          {
            echo "### $LANE lane record — now serving \`$FULL_SHA\`"
            echo
            echo "| lane | sha | run | recorded (UTC) |"
            echo "| --- | --- | --- | --- |"
            echo "| \`$LANE_CONTEXT\` | [\`$FULL_SHA\`]($GITHUB_SERVER_URL/$GH_REPO/commit/$FULL_SHA) | [\`$GITHUB_RUN_ID\`]($RUN_URL) | \`$SERVED_AT\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          # Deliberately non-fatal: bookkeeping must not fail a deploy that
          # already passed its health gate and identity assert. The failure
          # stays visible as a run annotation, and stays fail-closed on the
          # merge side — with no status on the SHA there is nothing for the
          # gate to pass on.
          if gh api "repos/$GH_REPO/statuses/$FULL_SHA" \
            -f state=success \
            -f context="$LANE_CONTEXT" \
            -f target_url="$RUN_URL" \
            -f description="$LANE serves $FULL_SHA run $GITHUB_RUN_ID at $SERVED_AT" \
            >/dev/null; then
            echo "$LANE lane record posted: $LANE_CONTEXT=success on $FULL_SHA"
          else
            echo "::warning::could not post commit status $LANE_CONTEXT on $FULL_SHA — the $LANE lane record is in this run's summary but is NOT queryable per-SHA, so the gate must not treat $FULL_SHA as proven"
          fi

  # ═══════════════════════════════════════════════════════════════════════
  # Stage 7 — Deploy freebuff-acp adapter (versioned release + `current` symlink)
  # Independent of the daemon: agents spawn the adapter as a child process, so a
  # new release is used by the next agent/session; running agents keep the old
  # one. Rollback = repoint the symlink.
  # ═══════════════════════════════════════════════════════════════════════
  deploy-freebuff:
    if: ${{ always() && inputs.run_deploy_freebuff }}
    runs-on: [self-hosted, paseo-host]
    # Checkout and local file operations only.
    permissions:
      contents: read
    steps:
      - name: Resolve ref
        id: ref
        # Inputs go through env, never interpolated into the script: a crafted
        # value must not be able to run shell on the self-hosted runner.
        env:
          FREEBUFF_REF: ${{ inputs.freebuff_ref }}
        run: |
          set -euo pipefail
          REF="${FREEBUFF_REF:-${{ github.sha }}}"
          # The ref becomes a directory name and a grep pattern below.
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{7,40}$'; then
            echo "::error::freebuff_ref must be a hex commit SHA (7-40 chars)"
            exit 1
          fi
          echo "sha=$REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          # Full checkout: sparse-checkout persists in the shared self-hosted
          # workspace and would strip scripts/ from the next build job.
          ref: ${{ steps.ref.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and install release
        # `choice` inputs are only enforced by the UI; `gh workflow run -f`
        # bypasses them, so the value is matched in the case below and passed via env.
        env:
          FREEBUFF_TARGET: ${{ inputs.freebuff_target }}
          RESOLVED_SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -euo pipefail
          SHA="$RESOLVED_SHA"
          case "$FREEBUFF_TARGET" in
            test) HOMES="${{ env.TEST_HOME }}" ;;
            prod) HOMES="${{ env.PROD_HOME }}" ;;
            both) HOMES="${{ env.TEST_HOME }} ${{ env.PROD_HOME }}" ;;
            *) echo "::error::freebuff_target must be test, prod or both"; exit 1 ;;
          esac
          for HOME_DIR in $HOMES; do
            ROOT="$HOME_DIR/freebuff-acp"
            # Unique per run: redeploying a SHA that `current` already serves must
            # never wipe the live release while the replacement is being built.
            RELNAME="${SHA}-r${GITHUB_RUN_ID}"
            REL="$ROOT/releases/$RELNAME"
            rm -rf "$REL"
            mkdir -p "$REL/plugins" "$REL/packages/freebuff-acp"
            cp -r plugins/freebuff "$REL/plugins/freebuff"
            cp -r packages/freebuff-acp/src "$REL/packages/freebuff-acp/src"
            (cd "$REL/plugins/freebuff" && npm ci --omit=dev --legacy-peer-deps --no-audit --no-fund && node scripts/build.mjs)

            # Smoke: the adapter must answer an ACP initialize before we switch to it.
            ENTRY="$REL/plugins/freebuff/dist/entry.js"
            RESP=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":1,"clientCapabilities":{}}}' \
              | timeout 20 node "$ENTRY" | head -n1 || true)
            echo "$RESP" | grep -q '"loadSession":true' || { echo "::error::adapter smoke failed for $HOME_DIR: $RESP"; exit 1; }

            ln -sfn "$REL" "$ROOT/current.new"
            mv -Tf "$ROOT/current.new" "$ROOT/current"
            echo "## freebuff-acp $SHA -> $ROOT/current/plugins/freebuff/dist/entry.js" >> "$GITHUB_STEP_SUMMARY"
            # Keep the 3 newest releases (never the one `current` points to).
            LIVE="$(basename "$(readlink "$ROOT/current")")"
            (cd "$ROOT/releases" && ls -1t | tail -n +4 | { grep -vxF -e "$RELNAME" -e "$LIVE" || true; } | xargs -r rm -rf)
          done
